[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = scroll lock

format = <label-layout> 
format-padding = 1
label-layout-background = ${color.layer2}
label-layout-underline = ${color.neon-br-pr3}
label-layout-spacing = 0

label-layout = %layout%
label-layout-padding = 2
; label-layout-background = #bc99ed
; label-layout-foreground = #000

