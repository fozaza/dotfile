[redshift]
; Day and night color temperatures in Kelvin
temp-day=5500
temp-night=2600
; Enable smooth transition between day and night
fade=1
; Location provider: 'manual', 'geoclue2', etc.
location-provider=manual
; Adjustment method: 'randr' (preferred), 'vidmode'
adjustment-method=randr

[manual]
; Latitude and Longitude of your location
; Longitudes west of Greenwich should be negative
lat=13.7563
lon=100.5018

[randr]
; Screen number to adjust (0-indexed)
screen=0
