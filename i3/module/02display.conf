exec --no-startup-id dex --autostart --environment i3
exec --no-startup-id xkb-switch -s us | xss-lock --transfer-sleep-lock -- i3lock --nofork
exec --no-startup-id nm-applet
exec --no-startup-id feh-bg-loader -l
exec_always --no-startup-id sh $HOME/.config/i3/script/runner.sh >/tmp/i3_mem_log.txt 2>&1
# exec_always --no-startup-id sh $HOME/.config/bgrunner/runner.sh
# exec_always --no-startup-id sh $HOME/.config/i3/memory_runner.sh #> /tmp/i3_mem_log.txt 2>&1
# exec_always --no-startup-id pkill memory_update ; $HOME/.config/i3/memory_update
# exec_always --no-startup-id pkill read_memory ; $HOME/.config/i3/read_memory
#exec_always --no-startup-id pkill redshift ; redshift
set $refresh_i3status killall -SIGUSR1 i3status
font pango:monospace 8


set $ws1 "1"
set $ws2 "2"
set $ws3 "3"
set $ws4 "4"
set $ws5 "5"
set $ws6 "6"
set $ws7 "7"
set $ws8 "8"
set $ws9 "9"
set $ws10 "10"

# bar {
#         status_command i3status
# }

for_window [class=".*"] border pixel 4
gaps inner 10
gaps outer 5
smart_borders on
smart_gaps on
